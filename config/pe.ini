# /etc/pe.ini - pe package manager configuration for CRUX Linux (CI container defaults)
#
# Override the config path with: pe --config /path/to/pe.ini <command>
# or environment variable: PE_CONFIG=/path/to/pe.ini

[paths]
# Installation root (standard CRUX root is /)
root = /

# CRUX ports tree location (kept in place; pe never relocates your ports tree)
ports_dir = /usr/ports

# Comma- or space-separated port collections in priority order
collections = core, opt, xorg, contrib

# Directory for cached binary packages and synced index.json
cache_dir = /var/cache/pe

# Directory for cached downloaded source tarballs used by `pe build`
source_cache = /var/cache/pe/sources

# Directory where `pe build` places compiled .pkg.tar.<ext> archives
package_dir = /var/cache/pe/packages

# Working directory for `pe build` ($SRC and $PKG)
work_dir = /var/cache/pe/work

# CRUX pkgadd configuration file (INSTALL/UPGRADE rules)
pkgadd_conf = /etc/pkgadd.conf

# CRUX ports sync config/drivers directories
ports_conf_dir = /etc/ports
ports_drivers_dir = /etc/ports/drivers

[repo]
# Binary repository release index (ezke5/packages rolling-x86_64)
repository = ezke5/packages
tag = rolling-x86_64
arch = x86_64
index_url = https://github.com/ezke5/packages/releases/download/rolling-x86_64/index.json

# HTTP timeout in seconds for syncing index.json and downloading binaries
timeout_seconds = 120

[build]
# Parallel build jobs (adjust via pe.ini or MAKEFLAGS if needed)
jobs = 4

# Compiler/linker flags exported to Pkgfile build()
cflags = -O2 -march=x86-64 -pipe
cxxflags = -O2 -march=x86-64 -pipe
ldflags =
makeflags = -j4

# Package archive compression: zst, xz, gz, bz2, lz
compression = zst

# Optional space-separated source mirror base URLs
source_mirrors =

# pkgmk-compatible build behavior flags (true/false)
download_sources = true
strip = true
compress_manpages = true
ignore_footprint = false
ignore_new = false
ignore_md5sum = false
ignore_signature = true
keep_work = false

# Source downloader program (curl or wget)
download_prog = curl
curl_opts =
wget_opts =
