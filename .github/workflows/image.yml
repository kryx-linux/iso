name: Build and Publish KryX Rolling Base Image

on:
  schedule:
    # Weekly rolling rebuild on Sundays at 06:00 UTC (after upstream CRUX ISO rebuilds)
    - cron: "0 6 * * 0"
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "config/core-exclude.txt"
      - "config/kpm.ini"
      - "config/keys/**"
      - "scripts/build-kpm.sh"
      - "scripts/extract-rootfs.sh"
      - "scripts/customize-rootfs.sh"
      - "scripts/verify-image.sh"
      - ".github/workflows/image.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      iso_url:
        description: "CRUX seed ISO download URL"
        required: false
        type: string
        default: "https://git.crux.nu/system/iso/releases/download/3.8-updated/crux-3.8-updated.iso"
      iso_sha256:
        description: "Optional expected SHA-256 checksum for the CRUX seed ISO"
        required: false
        type: string
        default: ""
      crux_version:
        description: "CRUX base version tag prefix"
        required: false
        type: string
        default: "3.8"
      kpm_ref:
        description: "Git ref of kryx-linux/kpm to build"
        required: false
        type: string
        default: "main"
      gports_ref:
        description: "Git ref of kryx-linux/gports to build"
        required: false
        type: string
        default: "main"
      full_core:
        description: "Install every CRUX core package (bypass config/core-exclude.txt)"
        required: false
        type: boolean
        default: false
      push_image:
        description: "Push built image to configured container registries"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GHCR_IMAGE: ghcr.io/kryx-linux/iso
  DOCKERHUB_IMAGE: kryx-linux/iso
  DEFAULT_ISO_URL: https://git.crux.nu/system/iso/releases/download/3.8-updated/crux-3.8-updated.iso
  CRUX_VERSION: ${{ inputs.crux_version || '3.8' }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout iso repository
        uses: actions/checkout@v4

      - name: Checkout kryx-linux/kpm
        uses: actions/checkout@v4
        with:
          repository: kryx-linux/kpm
          ref: ${{ inputs.kpm_ref || 'main' }}
          path: _kpm

      - name: Checkout kryx-linux/gports
        uses: actions/checkout@v4
        with:
          repository: kryx-linux/gports
          ref: ${{ inputs.gports_ref || 'main' }}
          path: _gports

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: _kpm/go.mod

      - name: Install host extraction and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            libarchive-tools \
            xz-utils \
            zstd

      - name: Lint shell scripts
        run: make lint

      - name: Build and test static kpm, kpm-index, kryx-src, and gports
        run: ./scripts/build-kpm.sh --src _kpm --gports-src _gports --out build/bin --test

      - name: Extract and customize KryX rootfs
        env:
          ISO_URL: ${{ inputs.iso_url || env.DEFAULT_ISO_URL }}
          ISO_SHA256: ${{ inputs.iso_sha256 || '' }}
          FULL_CORE: ${{ inputs.full_core == true && '1' || '0' }}
        run: |
          EXTRACT_ARGS=(
            --iso-url "$ISO_URL"
            --output build/container-rootfs
            --work-dir build/work
            --kpm-bin build/bin/kpm
          )
          if [ -n "$ISO_SHA256" ]; then
            EXTRACT_ARGS+=(--iso-sha256 "$ISO_SHA256")
          fi
          if [ "$FULL_CORE" = "1" ]; then
            EXTRACT_ARGS+=(--full-core)
          else
            EXTRACT_ARGS+=(--exclude-file config/core-exclude.txt)
          fi

          sudo ./scripts/extract-rootfs.sh "${EXTRACT_ARGS[@]}"
          sudo ./scripts/customize-rootfs.sh \
            --rootfs build/container-rootfs \
            --kpm-bin build/bin/kpm \
            --kpm-index-bin build/bin/kpm-index \
            --kpm-ini config/kpm.ini \
            --ports-core-repo https://github.com/kryx-linux/core.git \
            --ports-core-ref main \
            --tarball build/kryx-rootfs.tar.xz

          sudo chown "$(id -u):$(id -g)" build/kryx-rootfs.tar.xz
          echo "TARBALL_SIZE=$(du -h build/kryx-rootfs.tar.xz | cut -f1)" >> "$GITHUB_ENV"

      - name: Compute image metadata
        id: meta
        run: |
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          DATE_TAG="$(date -u +'%Y%m%d')"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          SHOULD_PUSH="false"
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ inputs.push_image }}" != "false" ]; then
            SHOULD_PUSH="true"
          fi
          {
            echo "build_date=${BUILD_DATE}"
            echo "date_tag=${DATE_TAG}"
            echo "short_sha=${SHORT_SHA}"
            echo "should_push=${SHOULD_PUSH}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: kryx-linux/iso:ci-verify
          build-args: |
            ROOTFS_TARBALL=build/kryx-rootfs.tar.xz
            CRUX_VERSION=${{ env.CRUX_VERSION }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VCS_REF=${{ steps.meta.outputs.short_sha }}

      - name: Verify built KryX container image
        run: ./scripts/verify-image.sh kryx-linux/iso:ci-verify

      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.meta.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble publish tags
        id: tags
        if: steps.meta.outputs.should_push == 'true'
        run: |
          TAGS=(
            "${GHCR_IMAGE}:latest"
            "${GHCR_IMAGE}:rolling"
            "${GHCR_IMAGE}:${CRUX_VERSION}"
            "${GHCR_IMAGE}:${CRUX_VERSION}-${{ steps.meta.outputs.date_tag }}"
            "${GHCR_IMAGE}:sha-${{ steps.meta.outputs.short_sha }}"
          )
          {
            echo "list<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push verified image to GHCR
        id: push
        if: steps.meta.outputs.should_push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            ROOTFS_TARBALL=build/kryx-rootfs.tar.xz
            CRUX_VERSION=${{ env.CRUX_VERSION }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VCS_REF=${{ steps.meta.outputs.short_sha }}
