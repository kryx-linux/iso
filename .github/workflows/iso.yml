name: Build and Release KryX Linux Live ISO (GRUB BIOS+UEFI)

on:
  schedule:
    # Weekly ISO + RootFS release build on Sundays at 08:00 UTC
    - cron: "0 8 * * 0"
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      crux_iso_url:
        description: "Upstream CRUX 3.8 seed ISO URL (provides base core/opt packages)"
        required: false
        type: string
        default: "https://git.crux.nu/system/iso/releases/download/3.8-updated/crux-3.8-updated.iso"
      kernel_version:
        description: "CRUX ISO kernel version to build"
        required: false
        type: string
        default: "6.18.63"
      kpm_ref:
        description: "Git ref of kryx-linux/kpm"
        required: false
        type: string
        default: "main"
      rebuild_all_pkgs:
        description: "Rebuild every packages.live package from source instead of reusing seed/remote binaries"
        required: false
        type: boolean
        default: false
      publish_release:
        description: "Publish kryx-linux-x86_64.iso & kryx-rootfs-x86_64-rolling.tar.xz to GitHub Release"
        required: false
        type: boolean
        default: true
      release_tag:
        description: "GitHub Release tag for ISO artifacts"
        required: false
        type: string
        default: "rolling-x86_64"

permissions:
  contents: write
  packages: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CRUX_VERSION: "3.8"
  KERNEL_VERSION: ${{ inputs.kernel_version || '6.18.63' }}
  CRUX_ISO_URL: ${{ inputs.crux_iso_url || 'https://git.crux.nu/system/iso/releases/download/3.8-updated/crux-3.8-updated.iso' }}
  GHCR_IMAGE: ghcr.io/kryx-linux/iso
  DOCKER_BUILD_NO_SUMMARY: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout iso repository
        uses: actions/checkout@v4

      - name: Validate shell scripts & CRUX kernel defconfig
        run: |
          make lint
          (cd kernel && ./checkdefconfig)

  build-base-and-seed:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout iso repository
        uses: actions/checkout@v4

      - name: Checkout kryx-linux/kpm
        uses: actions/checkout@v4
        with:
          repository: kryx-linux/kpm
          ref: ${{ inputs.kpm_ref || 'main' }}
          path: _kpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: _kpm/go.mod

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git libarchive-tools xz-utils zstd

      - name: Build static kpm (with integrated ports), kpm-index, and kryx-src
        run: ./scripts/build-kpm.sh --src _kpm --out build/bin --test

      - name: Extract CRUX 3.8 core/opt packages and build KryX base rootfs tarball
        run: |
          sudo ./scripts/extract-rootfs.sh \
            --iso-url "${CRUX_ISO_URL}" \
            --output build/container-rootfs \
            --work-dir build/work \
            --kpm-bin build/bin/kpm \
            --exclude-file config/core-exclude.txt \
            --save-pkgs build/seed-pkgs

          sudo ./scripts/customize-rootfs.sh \
            --rootfs build/container-rootfs \
            --kpm-bin build/bin/kpm \
            --kpm-index-bin build/bin/kpm-index \
            --kpm-ini config/kpm.ini \
            --ports-core-repo https://github.com/kryx-linux/core.git \
            --ports-core-ref main \
            --tarball build/kryx-rootfs.tar.xz

          sudo chown -R "$(id -u):$(id -g)" build/bin build/seed-pkgs build/kryx-rootfs.tar.xz
          tar -cf build/seed-pkgs.tar -C build/seed-pkgs .

      - name: Build, verify, and publish KryX OCI container image
        uses: docker/setup-buildx-action@v3

      - name: Build local container image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: kryx-linux/iso:ci-verify
          build-args: |
            ROOTFS_TARBALL=build/kryx-rootfs.tar.xz
            CRUX_VERSION=${{ env.CRUX_VERSION }}

      - name: Verify KryX container image
        run: ./scripts/verify-image.sh kryx-linux/iso:ci-verify

      - name: Log in to GHCR (non-PR builds)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push KryX base container image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:rolling
            ${{ env.GHCR_IMAGE }}:${{ env.CRUX_VERSION }}
          build-args: |
            ROOTFS_TARBALL=build/kryx-rootfs.tar.xz
            CRUX_VERSION=${{ env.CRUX_VERSION }}

      - name: Upload static binaries and base rootfs tarball
        uses: actions/upload-artifact@v4
        with:
          name: kryx-base-artifacts
          path: |
            build/bin/
            build/kryx-rootfs.tar.xz
          retention-days: 1

      - name: Upload extracted CRUX 3.8 seed packages (for essential pkg builder)
        uses: actions/upload-artifact@v4
        with:
          name: kryx-seed-pkgs
          path: build/seed-pkgs.tar
          retention-days: 1

  build-essential-pkgs:
    needs: build-base-and-seed
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout iso repository
        uses: actions/checkout@v4

      - name: Download base artifacts
        uses: actions/download-artifact@v4
        with:
          name: kryx-base-artifacts
          path: build

      - name: Download CRUX 3.8 seed packages
        uses: actions/download-artifact@v4
        with:
          name: kryx-seed-pkgs
          path: build

      - name: Prepare ports tree (core, opt, contrib, rolling) & seed packages
        run: |
          mkdir -p build/seed-pkgs build/local-pkgs build/ports-tree
          tar -xf build/seed-pkgs.tar -C build/seed-pkgs
          chmod +x build/bin/*

          for col in core opt contrib; do
            REPO_URL="https://github.com/kryx-linux/${col}.git"
            BRANCH="main"
            if ! git ls-remote --exit-code --heads "$REPO_URL" main >/dev/null 2>&1; then
              BRANCH="3.8"
            fi
            git clone --depth 1 --branch "$BRANCH" "$REPO_URL" "build/ports-tree/${col}"
          done
          git clone --depth 1 https://github.com/kryx-linux/ports.git build/ports-rolling-tmp
          for col_dir in pkg-tools kernel rolling; do
            if [ -d "build/ports-rolling-tmp/${col_dir}" ]; then
              cp -a "build/ports-rolling-tmp/${col_dir}" "build/ports-tree/${col_dir}"
            fi
          done
          rm -rf build/ports-rolling-tmp

      - name: Ensure every core & necessary live package is built inside KryX container
        env:
          REBUILD_ALL: ${{ inputs.rebuild_all_pkgs == true && '1' || '0' }}
        run: |
          # Load freshly built rootfs into a local Docker image so essential builds run cleanly inside KryX.
          docker build \
            --build-arg ROOTFS_TARBALL=build/kryx-rootfs.tar.xz \
            --build-arg CRUX_VERSION="${CRUX_VERSION}" \
            -t kryx-linux/iso:pkg-builder .

          EXTRA_FLAGS=()
          [ "$REBUILD_ALL" = "1" ] && EXTRA_FLAGS+=(--rebuild-all)

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            kryx-linux/iso:pkg-builder \
            /work/scripts/build-essential-pkgs.sh \
              --pkg-list /work/config/packages.live \
              --ports-dir /work/build/ports-tree \
              --seed-pkgs /work/build/seed-pkgs \
              --out-dir /work/build/local-pkgs \
              --work-dir /work/build/pkg-work \
              --kpm-bin /usr/bin/kpm \
              "${EXTRA_FLAGS[@]}"

          tar -cf build/local-pkgs.tar -C build/local-pkgs .
          ls -lh build/local-pkgs.tar

      - name: Upload verified core & essential packages bundle
        uses: actions/upload-artifact@v4
        with:
          name: kryx-essential-pkgs
          path: build/local-pkgs.tar
          retention-days: 1

  build-kernel:
    needs: build-base-and-seed
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout iso repository
        uses: actions/checkout@v4

      - name: Download KryX base artifacts (to compile kernel inside KryX container)
        uses: actions/download-artifact@v4
        with:
          name: kryx-base-artifacts
          path: build

      - name: Compile KryX kernel fresh inside KryX container (no CRUX kernel cache)
        run: |
          # Build local KryX container image so kernel compiles with KryX's own toolchain
          # (and KryX-x86_64 CC version branding, -kryx localversion, builder@kryx identity).
          docker build \
            --build-arg ROOTFS_TARBALL=build/kryx-rootfs.tar.xz \
            --build-arg CRUX_VERSION="${CRUX_VERSION}" \
            -t kryx-linux/iso:kernel-builder .

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            kryx-linux/iso:kernel-builder \
            /work/scripts/mkkernel.sh \
              --version "${KERNEL_VERSION}" \
              --localversion "-kryx" \
              --hostname "kryx" \
              --cc-brand "KryX-x86_64" \
              --build-user "builder" \
              --build-host "kryx" \
              --build-dir /work/build \
              --jobs "$(nproc)" \
              --force

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            kryx-linux/iso:kernel-builder \
            /work/scripts/mkbusybox.sh \
              --build-dir /work/build \
              --out /work/build/busybox-stage/busybox \
              --jobs "$(nproc)" \
              --force

          sudo chown -R "$(id -u):$(id -g)" build/kernel-stage build/busybox-stage

      - name: Pack staged KryX kernel artifact
        run: |
          tar -cf build/kernel-stage.tar -C build/kernel-stage .
          ls -lh build/kernel-stage.tar build/busybox-stage/busybox

      - name: Upload kernel stage artifact
        uses: actions/upload-artifact@v4
        with:
          name: kryx-kernel-stage
          path: build/kernel-stage.tar
          retention-days: 1

      - name: Upload KryX baseline x86-64 static busybox artifact
        uses: actions/upload-artifact@v4
        with:
          name: kryx-busybox
          path: build/busybox-stage/busybox
          retention-days: 1

  build-iso:
    needs: [build-base-and-seed, build-essential-pkgs, build-kernel]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout iso repository
        uses: actions/checkout@v4

      - name: Download base artifacts (kpm binaries + rootfs tarball)
        uses: actions/download-artifact@v4
        with:
          name: kryx-base-artifacts
          path: artifacts/kryx-base-artifacts

      - name: Download verified essential packages bundle
        uses: actions/download-artifact@v4
        with:
          name: kryx-essential-pkgs
          path: artifacts/kryx-essential-pkgs

      - name: Download staged CRUX ISO kernel
        uses: actions/download-artifact@v4
        with:
          name: kryx-kernel-stage
          path: artifacts/kryx-kernel-stage

      - name: Download KryX baseline x86-64 static busybox
        uses: actions/download-artifact@v4
        with:
          name: kryx-busybox
          path: artifacts/kryx-busybox

      - name: Install ISO, GRUB BIOS+UEFI, and QEMU boot-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            cpio \
            grub-common \
            grub-efi-amd64-bin \
            grub-pc-bin \
            gzip \
            mtools \
            ovmf \
            qemu-system-x86 \
            qemu-utils \
            squashfs-tools \
            xorriso \
            zstd

      - name: Assemble live rootfs, initramfs, and hybrid BIOS+UEFI GRUB ISO
        run: |
          mkdir -p build/bin build/local-pkgs build/kernel-stage
          cp -a artifacts/kryx-base-artifacts/bin/. build/bin/
          install -m 0755 artifacts/kryx-busybox/busybox build/bin/busybox
          chmod +x build/bin/*
          tar -xf artifacts/kryx-essential-pkgs/local-pkgs.tar -C build/local-pkgs
          tar -xf artifacts/kryx-kernel-stage/kernel-stage.tar -C build/kernel-stage

          sudo ./scripts/mkrootfs.sh \
            --build-dir build \
            --kpm-bin build/bin/kpm \
            --local-pkgs build/local-pkgs \
            --kernel-dir build/kernel-stage \
            --comp zstd

          sudo ./scripts/mkinitramfs.sh \
            --build-dir build \
            --busybox build/bin/busybox \
            --comp gzip

          sudo ./scripts/mkiso.sh \
            --build-dir build \
            --out kryx-linux-x86_64.iso

          sudo chown "$(id -u):$(id -g)" kryx-linux-x86_64.iso kryx-linux-x86_64.iso.sha256

      - name: Verify built ISO structure, shared libs, and busybox ISA
        run: ./scripts/verify-iso.sh kryx-linux-x86_64.iso

      - name: Smoke-test live ISO boot, offline setup, and setup-chroot in QEMU (baseline qemu64 BIOS)
        run: |
          truncate -s 4G /tmp/kryx-ci-disk.img
          python3 - <<'PY'
          import os, pty, select, socket, subprocess, sys, time

          iso = "kryx-linux-x86_64.iso"
          disk = "/tmp/kryx-ci-disk.img"
          mon_sock = "/tmp/qemu-mon.sock"
          if os.path.exists(mon_sock):
              os.unlink(mon_sock)

          master_fd, slave_fd = pty.openpty()
          cmd = [
              "qemu-system-x86_64",
              "-cpu", "qemu64",
              "-m", "2048",
              "-smp", "2",
              "-drive", f"file={disk},format=raw,if=virtio",
              "-cdrom", iso,
              "-boot", "d",
              "-nic", "none",
              "-display", "none",
              "-serial", "stdio",
              "-monitor", f"unix:{mon_sock},server,nowait",
              "-no-reboot",
          ]
          if os.access("/dev/kvm", os.R_OK | os.W_OK):
              cmd.insert(1, "-enable-kvm")

          proc = subprocess.Popen(cmd, stdin=slave_fd, stdout=slave_fd, stderr=subprocess.PIPE, close_fds=True)
          os.close(slave_fd)

          def send_mon(line):
              with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as s:
                  s.settimeout(2)
                  s.connect(mon_sock)
                  time.sleep(0.05)
                  try: s.recv(4096)
                  except Exception: pass
                  s.sendall((line + "\n").encode())
                  time.sleep(0.1)
                  try: s.recv(4096)
                  except Exception: pass

          buf = b""
          start = time.time()
          sent_grub = False
          sent_cmds = False
          passed = False
          grub_wait = 3.0 if "-enable-kvm" in cmd else 6.0
          timeout = 180 if "-enable-kvm" in cmd else 360

          try:
              while time.time() - start < timeout:
                  elapsed = time.time() - start
                  if not sent_grub and elapsed >= grub_wait and os.path.exists(mon_sock):
                      send_mon("sendkey down")
                      time.sleep(0.25)
                      send_mon("sendkey down")
                      time.sleep(0.25)
                      send_mon("sendkey ret")
                      sent_grub = True

                  r, _, _ = select.select([master_fd], [], [], 0.2)
                  if r:
                      try:
                          chunk = os.read(master_fd, 4096)
                      except OSError:
                          break
                      if not chunk:
                          break
                      buf += chunk
                      text = buf.decode("utf-8", errors="replace")

                      if "Kernel panic" in text:
                          print("FAIL: Kernel panic detected!\n" + text[-2000:])
                          break
                      if "error while loading shared libraries" in text:
                          print("FAIL: Missing shared library during boot!\n" + text[-2000:])
                          break
                      if 'cannot execute "/etc/rc"' in text:
                          print("FAIL: /etc/rc failed to execute!\n" + text[-2000:])
                          break
                      if "change your password" in text:
                          print("FAIL: PAM forced password change on live autologin!\n" + text[-2000:])
                          break

                      if not sent_cmds and ("KryX Linux Live ready." in text or "automatic login" in text) and ("# " in text[-200:] or "~#" in text[-200:] or "root@" in text[-200:]):
                          cmds = (
                              "( set -e\n"
                              "  uname -a\n"
                              "  cat /proc/version\n"
                              "  kpm --version\n"
                              "  ports --version\n"
                              "  command -v dialog iwctl setup-kryx\n"
                              "  test -f /run/live/media/pool/packages.list && echo 'POOL''_OK'\n"
                              "  iwctl device list >/dev/null 2>&1 && echo 'IWD''_OK' || (cat /var/log/iwd.log /var/log/dbus.log 2>/dev/null; false)\n"
                              "  mkfs.ext4 -F /dev/vda && mount /dev/vda /mnt\n"
                              "  setup --offline --root /mnt --profile minimal -y\n"
                              "  setup-chroot /mnt /bin/sh -c 'kpm --version && test -f /etc/inittab && test -x /etc/rc && ls /boot/vmlinuz* && echo \"CHROOT\"\"_OK\"'\n"
                              "  echo 'KRYX_BOOT''_DONE'\n"
                              ") && poweroff || echo 'KRYX_SMOKE''_FAILED'\n"
                          )
                          os.write(master_fd, cmds.encode())
                          sent_cmds = True

                      if "KRYX_SMOKE_FAILED" in text:
                          print("FAIL: Guest smoke test command failed!")
                          break

                      if "KRYX_BOOT_DONE" in text:
                          # Drain serial output while waiting up to 45s for /etc/rc.shutdown to cleanly power off QEMU!
                          shut_end = time.time() + 45
                          while time.time() < shut_end and proc.poll() is None:
                              rr, _, _ = select.select([master_fd], [], [], 0.2)
                              if rr:
                                  try:
                                      c = os.read(master_fd, 4096)
                                      if c: buf += c
                                  except OSError:
                                      break
                          passed = (proc.poll() is not None)
                          if not passed:
                              print("FAIL: clean poweroff via /etc/rc.shutdown hung!")
                          break
                  if proc.poll() is not None:
                      break
          finally:
              proc.terminate()
              try: proc.wait(timeout=3)
              except subprocess.TimeoutExpired: proc.kill()
              os.close(master_fd)
              if os.path.exists(disk):
                  os.unlink(disk)

          text = buf.decode("utf-8", errors="replace")
          print(text[-4000:])
          if not passed:
              sys.exit(1)
          for marker in ("KryX-x86_64", "6.18.63-kryx", "POOL_OK", "IWD_OK", "CHROOT_OK"):
              if marker not in text:
                  print(f"FAIL: expected {marker!r} in boot/install output")
                  sys.exit(1)
          if "no more processes left in this runlevel" in text:
              print("FAIL: SysVinit shutdown hung without invoking halt/reboot!")
              sys.exit(1)
          print("PASS: KryX live ISO booted, verified iwd/D-Bus + /run/live/media/pool, installed offline, entered chroot, and powered off cleanly!")
          PY

      - name: Prepare release checksums
        run: |
          cp -f artifacts/kryx-base-artifacts/kryx-rootfs.tar.xz kryx-rootfs-x86_64-rolling.tar.xz
          sha256sum kryx-linux-x86_64.iso kryx-rootfs-x86_64-rolling.tar.xz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload ISO workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kryx-linux-x86_64-iso
          path: |
            kryx-linux-x86_64.iso
            kryx-rootfs-x86_64-rolling.tar.xz
            SHA256SUMS.txt
          retention-days: 7

      - name: Publish ISO and RootFS to GitHub Release
        if: github.event_name != 'pull_request' && inputs.publish_release != false
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (inputs.release_tag || 'rolling-x86_64') }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "KryX Linux ${RELEASE_TAG} (Live ISO & RootFS)" \
              --notes "Automated KryX Linux hybrid BIOS+UEFI GRUB Live ISO (CRUX ISO linux-${KERNEL_VERSION} kernel, kpm) and base RootFS tarball."
          fi
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            kryx-linux-x86_64.iso \
            kryx-rootfs-x86_64-rolling.tar.xz \
            SHA256SUMS.txt \
            --clobber
