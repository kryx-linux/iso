set default=0
set timeout=10

set color_normal=light-gray/black
set color_highlight=black/light-cyan
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-cyan

search --no-floppy --file --set=root /kryx-media

if [ "${grub_platform}" = "efi" ]; then
    insmod efi_gop
    insmod efi_uga
else
    insmod vbe
    insmod vga
fi
insmod all_video

menuentry "KryX Linux Live (x86_64)" {
    linux /boot/vmlinuz quiet loglevel=3
    initrd /boot/initrd.img
}

menuentry "KryX Linux Live (Safe Graphics / nomodeset / EFI reset)" {
    linux /boot/vmlinuz nomodeset vga=normal reboot=efi loglevel=4
    initrd /boot/initrd.img
}

menuentry "KryX Linux Live (Serial Console ttyS0,115200)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200n8 loglevel=4
    initrd /boot/initrd.img
}

menuentry "KryX Linux Live (Initramfs Debug Shell)" {
    linux /boot/vmlinuz debug dshell console=tty0 console=ttyS0,115200n8
    initrd /boot/initrd.img
}

menuentry "Reboot" {
    reboot
}

menuentry "Power Off" {
    halt
}
